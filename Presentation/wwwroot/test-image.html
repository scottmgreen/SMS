<!DOCTYPE html>
<html>
<head>
    <title>Background Image Test</title>
</head>
<body>
    <h1>Image Path Test</h1>
    <p>Testing direct image access:</p>
    <img src="/images/background_opening.jpg" alt="Background Test" style="max-width: 300px; border: 2px solid red;" />
    
    <p>Testing with tilde notation:</p>
    <img src="~/images/background_opening.jpg" alt="Background Test with Tilde" style="max-width: 300px; border: 2px solid blue;" />
    
    <div style="width: 300px; height: 200px; border: 2px solid green; background-image: url('/images/background_opening.jpg'); background-size: cover;">
        Direct CSS Background
    </div>
    
    <div style="width: 300px; height: 200px; border: 2px solid orange; background-image: url('~/images/background_opening.jpg'); background-size: cover;">
        Tilde CSS Background
    </div>
</body>
</html>
